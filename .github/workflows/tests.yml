name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, node24
        with:
          python-version: "3.13"
      # Python and JavaScript tests, documentation check included. Models and
      # services are injected fakes: no network call, no API key.
      - run: uv run --extra web --extra dev pytest -q

  browsers:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, node24
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          uv sync --frozen --extra web --extra dev
          npm ci --prefix tests/browser
      - name: Install browser and system dependencies
        working-directory: tests/browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run local synthetic storefront recipe
        working-directory: tests/browser
        run: npm test -- --project=${{ matrix.browser }}
      - name: Archive browser reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: storefront-${{ matrix.browser }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: warn
          retention-days: 7
