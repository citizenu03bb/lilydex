name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # Python and JavaScript tests, documentation check included. Models and
      # services are injected fakes: no network call, no API key.
      - run: uv run --extra web --extra dev pytest -q
