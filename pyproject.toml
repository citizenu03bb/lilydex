[project]
name = "pokeprice"
version = "0.1.0"
description = "Automated Pokemon card album scanning and Cardmarket EUR valuation pipeline powered by local Gemma 4 E4B vision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "google-genai>=2.28.0",
    "python-dotenv>=1.2.4",
    "pyrage>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0,<1",
]
web = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.34.0,<1",
]
cloud = [
    "google-genai>=1.0.0",
]
# Independent edition check (M2): DINOv2 image similarity, local, CPU or GPU.
vision = [
    "torch>=2.4",
    "transformers>=4.45",
]

[project.scripts]
pokeprice = "pokeprice.cli:main"
pokeprice-manage = "pokeprice.manage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeprice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_scrypt: keep the production password hashing cost"]

# Le serveur OCI (aarch64, sans GPU) prend torch CPU : la roue PyPI aarch64
# tire plusieurs Go de bibliothèques CUDA inutiles.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" }]
