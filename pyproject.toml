[project]
name = "pokeprice"
version = "0.1.0"
description = "Automated Pokemon card album scanning and Cardmarket EUR valuation pipeline powered by local Gemma 4 E4B vision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "google-genai>=2.28.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
cloud = [
    "google-genai>=1.0.0",
]

[project.scripts]
pokeprice = "pokeprice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeprice"]
